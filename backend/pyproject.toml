[project]
name = "flowtask-api"
version = "1.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov=main --cov=seed --cov-report=term-missing:skip-covered"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    # SQLite no refleja índices por expresión (lower(name)); es esperado y está cubierto en Postgres.
    "ignore:.*expression-based index.*",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle + pyflakes
    "I",            # imports ordenados
    "B",            # bugbear: errores comunes
    "UP",           # sintaxis moderna
    "S",            # bandit: seguridad
    "SIM",          # simplificaciones
    "RUF",
]
ignore = [
    "B008",    # Depends()/Query() en defaults es el idioma de FastAPI
    "RUF001",  # textos en español con caracteres "ambiguos" (–, ’) son intencionales
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert y contraseñas de prueba

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/", "^tests/"]

[[tool.mypy.overrides]]
module = ["slowapi.*"]
ignore_missing_imports = true
