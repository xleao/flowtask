# Sirve la SPA y hace de reverse proxy hacia la API (mismo origen).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 64k;   # una tarea pesa < 2 KB

    root /usr/share/nginx/html;
    index index.html;

    # Compresión: JS/CSS/JSON viajan ~3x más livianos (las fuentes woff2 ya vienen comprimidas).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad (misma política que IndexUNI en producción).
    # CSP: todo el JS/CSS es propio, la API es mismo origen -> 'self' alcanza.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se sobrescribe (no se agrega): el cliente no puede inyectar una IP falsa
        # para evadir el rate limit de la API.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
        # La API ya manda estas cabeceras; se ocultan para no duplicarlas con las del server.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
    }

    # Ojo: un add_header dentro de un location anula TODOS los del server
    # (se perdería la CSP). Por eso el cache se controla con `expires`.

    # Assets con hash en el nombre: cache largo.
    location /assets/ {
        expires 1y;
    }

    # SPA: cualquier ruta desconocida devuelve index.html, siempre revalidado.
    location / {
        try_files $uri /index.html;
        expires -1;
    }

    location ~ /\. { deny all; }
}
