# docker compose up --build
#   App:  http://localhost:8080
#   API:  http://localhost:8010/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowtask
      POSTGRES_USER: flowtask
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowtask}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowtask -d flowtask"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Sin "ports": la base solo es accesible desde la red interna de compose.

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://flowtask:${POSTGRES_PASSWORD:-flowtask}@db:5432/flowtask
      CORS_ORIGINS: http://localhost:8080,http://localhost:5180
      INIT_DB_ON_STARTUP: "false"   # ya lo hace `python seed.py` en el CMD
      LOG_FORMAT: json
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8010:8010"   # solo desde esta máquina (para /docs y curl)
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
